<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Socket - Misael Alexander</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="contenedor">

    <header>
        <h1>Práctica de evaluación usando Sockets de comunicación</h1>
        <p>Chat Node.js - Misael Alexander</p>
    </header>

    <section id="login" class="tarjeta-login">
        <h2>Ingresar al chat</h2>

        <input
            type="text"
            id="usuario"
            placeholder="Ingresa tu nombre"
            autocomplete="off"
        >

        <button id="btnIngresar">
            Ingresar al chat
        </button>
    </section>

    <section id="chat" class="oculto">

        <div class="barra-usuario">
            Usuario conectado:
            <strong id="nombreUsuario"></strong>
        </div>

        <div id="ventanaMensajes">
            <div id="mensajes"></div>
        </div>

        <p id="escribiendo"></p>

        <div class="zona-mensaje">
            <input
                type="text"
                id="mensaje"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >

            <button id="btnEnviar">
                Enviar
            </button>
        </div>

        <div class="zona-archivo">
            <label for="archivo">
                Adjuntar foto, video o documento:
            </label>

            <input
                type="file"
                id="archivo"
            >

            <button id="btnArchivo">
                Enviar archivo
            </button>
        </div>

    </section>

</div>

<audio id="sonidoMensaje" preload="auto">
    <source
        src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3"
        type="audio/mpeg"
    >
</audio>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>

</body>
</html>
